<script type="text/javascript">
  (function () {
    const COLOR = '#A7B3DF';
    const SOURCES = ['msg', 'flow', 'global', 'str', 'env', 'jsonata'];

    function countryCodeIsValid(value) {
      if (!value) return true;
      return /^(\+|00)?[1-9]\d{0,3}$/.test(String(value).replace(/[\s\-().]/g, ''));
    }

    RED.nodes.registerType('smstunnel-account', {
      category: 'config',
      defaults: {
        name: { value: '' },
        deviceId: { value: '' },
        defaultCountryCode: { value: '', validate: countryCodeIsValid },
        // No field for it: only for a self-hosted SMSTunnel or a test server, set in the flow's JSON.
        serverUrl: { value: '' },
      },
      credentials: {
        apiKey: { type: 'password', required: true },
      },
      label: function () {
        return this.name || this._('smstunnel.paletteLabel.account');
      },
    });

    function senderDefinition(kind) {
      return {
        category: 'SMSTunnel',
        color: COLOR,
        defaults: {
          name: { value: '' },
          account: { value: '', type: 'smstunnel-account', required: true },
          to: { value: 'to', validate: RED.validators.typedInput('toType') },
          toType: { value: 'msg' },
          message: { value: 'payload', validate: RED.validators.typedInput('messageType') },
          messageType: { value: 'msg' },
          deviceId: { value: '' },
          wait: { value: false },
        },
        inputs: 1,
        outputs: 1,
        icon: 'smstunnel.svg',
        paletteLabel: function () {
          return this._('smstunnel.paletteLabel.' + kind);
        },
        label: function () {
          return this.name || (kind === 'code' ? 'SMSTunnel code' : 'SMSTunnel send');
        },
        labelStyle: function () {
          return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function () {
          $('#node-input-to').typedInput({ default: 'msg', typeField: '#node-input-toType', types: SOURCES });
          $('#node-input-message').typedInput({
            default: 'msg',
            typeField: '#node-input-messageType',
            types: SOURCES,
          });
        },
      };
    }

    RED.nodes.registerType('smstunnel-send', senderDefinition('send'));
    RED.nodes.registerType('smstunnel-code', senderDefinition('code'));

    RED.nodes.registerType('smstunnel-received', {
      category: 'SMSTunnel',
      color: COLOR,
      defaults: {
        name: { value: '' },
        account: { value: '', type: 'smstunnel-account', required: true },
        interval: {
          value: 60,
          required: true,
          validate: function (value) {
            return Number(value) >= 10;
          },
        },
        deviceId: { value: '' },
        phone: { value: '' },
        startWith: { value: 'new' },
      },
      inputs: 1,
      outputs: 1,
      icon: 'smstunnel.svg',
      paletteLabel: function () {
        return this._('smstunnel.paletteLabel.received');
      },
      label: function () {
        return this.name || 'SMSTunnel received';
      },
      labelStyle: function () {
        return this.name ? 'node_label_italic' : '';
      },
    });
  })();
</script>

    <input type="text" id="node-config-input-name" data-i18n="[placeholder]smstunnel.placeholder.accountName" />
