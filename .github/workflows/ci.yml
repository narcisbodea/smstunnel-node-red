name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node }}, Node-RED ${{ matrix.node-red }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        node-red: ["5"]
        include:
          - node: "22"
            node-red: "4"
          - node: "22"
            node-red: "3.1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install the Node-RED version under test
        if: matrix.node-red != '5'
        run: |
          mkdir -p "$RUNNER_TEMP/node-red"
          cd "$RUNNER_TEMP/node-red"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "node-red@${{ matrix.node-red }}"
          echo "NODE_RED_HOME=$RUNNER_TEMP/node-red" >> "$GITHUB_ENV"
      - run: npm test
      - name: The package holds what Node-RED needs
        run: npm pack --dry-run
